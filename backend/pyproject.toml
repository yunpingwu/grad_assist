[project]
name = "grad-assist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.2.0",
    "minio>=7.2.20",
    "psycopg[binary,pool]>=3.2.0",
    "pymilvus>=3.0.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
    "flagembedding>=1.4.0",
    "transformers>=4.44.2,<5",
    # gpu 打开，cpu 关闭
    "torch>=2.7",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "mcp[cli]>=2.0.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "cachetools>=7.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ragas>=0.4.3",
    "langchain-community<0.4",
    "ipython>=9.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# 默认排除集成测试（依赖真实 MinerU/Milvus/MinIO/LLM 凭据），手动时用 pytest -m integration
addopts = ["-m", "not integration"]
markers = [
    "integration: 依赖真实外部环境（MinerU API / Milvus / MinIO / LLM 凭据）的端到端测试，默认不运行",
]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
# E=错误 F=未使用/未定义 W=警告 I=import排序 UP=py3.13新写法 B=常见bug模式
select = ["E", "F", "W", "I", "UP", "B"]

# FastAPI 的 File(...)/Field(...) 作为默认参数是框架惯用法，非 bug，仅对 API 路由忽略
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# PyTorch 软件源
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


