
#
# 资源上限合计 4 CPU / 8 GiB：
#   etcd 0.3 + minio 0.5 + milvus 2.0 + attu 0.2 + postgres 1.0 = 4.0 CPU
#   etcd 512M + minio 1024M + milvus 4096M + attu 512M + postgres 2048M = 8192M
#
# Attu 因此改到 8002，避免占用后端端口。
networks:
  app-net:
    driver: bridge

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DATA_ROOT:-./data}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-server
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M

  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: milvus-standalone
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      - MEMORY_LIMIT=4096M
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DATA_ROOT:-./data}/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
    networks:
      - app-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 60s

  attu:
    image: zilliz/attu:v2.4.8
    container_name: milvus-attu
    restart: always
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "8002:3000"
    networks:
      - app-net
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M

  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-grad_assist}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grad_assist}"]
      interval: 5s
      timeout: 5s
      retries: 10
