[project]
name = "grad-assist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.15.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "minio>=7.2.20",
    "pymilvus>=3.0.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
    "flagembedding>=1.4.0",
    "transformers>=4.44.2,<5",
    "torch>=2.7",
    "loguru>=0.7.3",
    "pymongo>=4.12.0,<4.17.0",
    "pillow>=12.3.0",
    "mcp>=2.0.0",
    "pydantic-settings>=2.15.0",
    "langgraph-checkpoint-mongodb>=0.4.0"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E=错误 F=未使用/未定义 W=警告 I=import排序 UP=py3.13新写法 B=常见bug模式
select = ["E", "F", "W", "I", "UP", "B"]

# FastAPI 的 File(...)/Field(...) 作为默认参数是框架惯用法，非 bug，仅对 API 路由忽略
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

# 指定 PyTorch CUDA 12.8 软件源
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 强制 PyTorch 相关依赖从 CUDA 软件源安装
[tool.uv.sources]
torch = { index = "pytorch-cu128" }


